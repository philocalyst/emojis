[package]
name = "emojis"
build = "./src/build.rs"
version = "0.6.4"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
rust-version = "1.60"

[dependencies]
bincode = "1.3"
once_cell = "1.20.3"
phf = { version = "0.11.1", default-features = false }
serde = { version = "1.0.145", features = ["derive"] } 

[dependencies.uniffi]
version = "=0.29"
features = ["bindgen", "cli"]

[build-dependencies]
uniffi = { version = "=0.29", features = ["build"] }
then = "0.1.0"
anyhow = "1.0"
indexmap = "1.9.3"
curl = "0.4.47"
serde = { version = "1.0.145", features = ["derive"] } # Remove optional = true
heck = "0.3.2"
bincode = "1.3"
serde_json = "1.0.99"

[dev-dependencies]
serde_json = "1.0.99"
toml = "0.5.11"

[lib]
name = "emojis"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

