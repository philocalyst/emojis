[package]
name = "emojis"
version = "1.0.3"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
rust-version = "1.60"

[dependencies]
bitcode = "0.6.5"
once_cell = "1.20.3"
parity-scale-codec = { version = "3.5", features = ["derive"] }
phf = { version = "0.11.1", default-features = false }
serde = { version = "1.0.145", default-features = false, features = ["derive"]}



[dev-dependencies]
serde_json = "1.0.99"
toml = "0.5.11"

[workspace]
members = ["generate"]

[lib]
name = "emojis"
crate-type = ["cdylib", "staticlib", "rlib"]


